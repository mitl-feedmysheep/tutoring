name: CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: tutoring
  CONTAINER: tutoring
  HOST_PORT: "3010"

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mitl admin과 같은 방식: buildx 플러그인을 runner 전용 DOCKER_CONFIG에 준비
      - name: Prepare Docker config
        run: |
          echo "DOCKER_CONFIG=$HOME/.docker-github-actions" >> $GITHUB_ENV
          mkdir -p "$HOME/.docker-github-actions/cli-plugins"
          [ -f "$HOME/.docker-github-actions/config.json" ] || echo '{}' > "$HOME/.docker-github-actions/config.json"

      - name: Ensure buildx plugin available
        run: |
          if [ ! -x "$DOCKER_CONFIG/cli-plugins/docker-buildx" ]; then
            if [ -x "$HOME/.docker/cli-plugins/docker-buildx" ]; then
              cp "$HOME/.docker/cli-plugins/docker-buildx" "$DOCKER_CONFIG/cli-plugins/docker-buildx"
            elif [ -x "/opt/homebrew/lib/docker/cli-plugins/docker-buildx" ]; then
              cp "/opt/homebrew/lib/docker/cli-plugins/docker-buildx" "$DOCKER_CONFIG/cli-plugins/docker-buildx"
            else
              echo "docker-buildx plugin not found on runner" >&2
              exit 1
            fi
            chmod +x "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          fi
          docker buildx version

      - name: Ensure BuildKit builder ready
        run: |
          docker buildx create --name buildkit --use --driver docker-container 2>/dev/null || docker buildx use buildkit
          docker buildx inspect --bootstrap

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # 격리 테스트는 같은 Mac mini의 test-mysql(:3307) tutoring_test 스키마를 쓴다
      - name: Test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm test

      - name: Build Docker image
        run: |
          docker buildx build \
            --builder buildkit \
            --load \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Start container with Doppler env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          command -v doppler >/dev/null || brew install dopplerhq/cli/doppler
          ENV_FILE=$(mktemp)
          # 러너는 Mac mini 사용자 계정으로 돈다. 누가 이 Mac에서 doppler login을 해두면
          # CLI가 키체인의 로그인 정보를 읽으려다 실패하므로, 빈 설정 폴더를 써서 DOPPLER_TOKEN만 쓰게 한다.
          DOPPLER_DIR=$(mktemp -d)
          trap 'rm -f "$ENV_FILE"; rm -rf "$DOPPLER_DIR"' EXIT
          doppler secrets download --no-file --format docker --no-check-version --config-dir "$DOPPLER_DIR" > "$ENV_FILE"

          docker rm -f $CONTAINER 2>/dev/null || true
          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            -p $HOST_PORT:3000 \
            --env-file "$ENV_FILE" \
            $IMAGE:${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:$HOST_PORT/api/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed" >&2
          docker logs --tail 50 $CONTAINER
          exit 1

      - name: Cleanup old images
        if: always()
        run: |
          docker images $IMAGE --format '{{.Tag}}' | grep -vE "^(latest|${{ github.sha }})$" | xargs -I {} docker rmi $IMAGE:{} 2>/dev/null || true
          docker image prune -f
